[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rillprobe"
version = "0.1.0"
description = "AI gateway contract testing for Unicode, SSE streams and rerank source indices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rillprobe contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.scripts]
rillprobe = "rillprobe.cli:main"

[project.urls]
Repository = "https://github.com/bglglzd/rillprobe"

[tool.setuptools.package-data]
rillprobe = ["assets/*.html", "assets/*.svg"]

[tool.setuptools.packages.find]
include = ["rillprobe*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
